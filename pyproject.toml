[project]
name = "ensf519-assignment2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.10",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pillow>=12.1.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cuda = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
directml = [
    "torch-directml",
    "torchvision",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "directml" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
